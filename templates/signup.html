{% extends 'base.html' %}

{% block title %}Sign Up | MediTrack{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 50vh; padding: 1.75rem 0;">
    <div class="medical-card p-3 auth-card" style="max-width: 680px; width: 100%; position: relative; overflow: hidden;">
        <div class="position-absolute top-0 start-0 w-100 h-1 bg-primary"></div>

        <div class="text-center mb-3">
            <div class="icon-box-emerald mx-auto mb-2" style="width: 52px; height: 52px; font-size: 1.35rem;">
                <i class="bi bi-person-plus"></i>
            </div>
            <h2 class="fw-black mb-2 auth-title">Create <span class="text-primary">Account</span></h2>
            <p class="text-muted auth-subtitle mb-0">Fill in your details to create a new account.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="row g-2">
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">First Name</label>
                    <input type="text" name="first_name" class="form-control bg-light" placeholder="Drishya" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Last Name</label>
                    <input type="text" name="last_name" class="form-control bg-light" placeholder="Adhikari" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i
                                class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control border-start-0 bg-light"
                            placeholder="meditrack@gmail.com" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Phone</label>
                    <input type="text" name="phone" class="form-control bg-light" placeholder="98XXXXXXXX">
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Age</label>
                    <input type="number" name="age" min="1" class="form-control bg-light" placeholder="30">
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Gender</label>
                    <select name="gender" class="form-select bg-light">
                        <option value="" disabled selected>Select gender...</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Address</label>
                    <textarea name="address" class="form-control bg-light" rows="1" placeholder="City, Street, Ward"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"></span>
                        <input type="password" name="password" class="form-control border-start-0 bg-light"
                            placeholder="Minimum 8 characters" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"></span>
                        <input type="password" name="confirm_password" class="form-control border-start-0 bg-light"
                            placeholder="Re-enter your key" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="p-2 bg-primary-light rounded-4 border border-primary border-opacity-10 h-100 d-flex align-items-center">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms" required>
                            <label class="form-check-label small text-muted" for="terms">
                                I agree to the <a href="#" class="text-primary fw-bold text-decoration-none">terms and conditions</a>.
                            </label>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-black auth-btn">Create Account</button>
                </div>
            </div>
        </form>

        <div class="text-center mt-3 pt-2 border-top">
            <p class="text-muted small mb-2">Already have an account?</p>
            <a href="{% url 'accounts:login' %}" class="btn btn-outline-emerald w-100 py-2 fw-bold auth-btn">Sign In</a>
        </div>
    </div>
</div>

<style>
    .fw-black {
        font-weight: 800;
        letter-spacing: -1px;
    }

    .form-control,
    .form-select {
        border: 1px solid var(--border);
        padding: 0.7rem 1rem;
    }

    .input-group-text {
        border: 1px solid var(--border);
    }

    .auth-card .form-label {
        margin-bottom: 0.35rem;
        font-size: 0.74rem;
        letter-spacing: 0.06em;
    }

    .auth-title {
        font-size: 1.35rem;
        line-height: 1.2;
    }

    .auth-subtitle {
        font-size: 0.9rem;
    }

    .auth-btn {
        font-size: 0.95rem;
    }

    .auth-card .form-check-label,
    .auth-card .small {
        font-size: 0.82rem;
    }

    .auth-card .form-control,
    .auth-card .form-select {
        font-size: 0.95rem;
    }
</style>
{% endblock %}
