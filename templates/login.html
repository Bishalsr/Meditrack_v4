{% extends 'base.html' %}

{% block title %}Sign In | MediTrack{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 45vh; padding: 1.5rem 0;">
    <div class="medical-card p-4 auth-card" style="max-width: 460px; width: 100%; position: relative; overflow: hidden;">
        <div class="position-absolute top-0 start-0 w-100 h-1 bg-primary"></div>

        <div class="text-center mb-4">
            
            <h2 class="fw-black mb-2">Sign <span class="text-primary">In</span></h2>
            <p class="text-muted fs-6">Enter your account details to continue.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i
                            class="bi bi-envelope"></i></span>
                    <input type="email" name="email" class="form-control border-start-0 bg-light"
                        placeholder="meditrack@gmail.com" required>
                </div>
            </div>

            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <label class="form-label small fw-bold text-muted text-uppercase letter-spacing-1">Password</label>
                    <a href="{% url 'accounts:forgot_password' %}"
                        class="small text-primary text-decoration-none fw-bold">Forgot password?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 bg-light"
                        placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-black fs-5">Sign In</button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-3">Don't have an account?</p>
            <a href="{% url 'accounts:signup' %}" class="btn btn-outline-emerald w-100 py-2 fw-bold">Create Account</a>
        </div>

        <div class="mt-3 text-center">
            <a href="{% url 'google_login' %}"
                class="btn btn-light border w-100 py-2 d-flex align-items-center justify-content-center gap-3 fw-bold">
                <img src="https://www.google.com/favicon.ico" width="20" height="20"> Continue with Google
            </a>
        </div>
    </div>
</div>

<style>
    .fw-black {
        font-weight: 800;
        letter-spacing: -1px;
    }

    .input-group-text {
        padding-left: 1.25rem;
        font-size: 1.1rem;
        border: 1px solid var(--border);
    }

    .form-control {
        border: 1px solid var(--border);
    }

    .auth-card .form-label {
        margin-bottom: 0.4rem;
    }
</style>
{% endblock %}
