{% extends 'base.html' %}

{% block title %}Reset Password | MediTrack{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh; padding-top: 4rem;">
    <div class="glass-card p-5" style="max-width: 500px; width: 100%;">
        <div class="text-center mb-5">
            <div class="icon-box mx-auto mb-4 bg-primary bg-opacity-10 text-primary"
                style="width: 80px; height: 80px; font-size: 2rem;">
                <i class="bi bi-key"></i>
            </div>
            <h2 class="fw-bold">Reset <span class="text-primary">Password</span></h2>
            <p class="text-muted small">Enter your email to receive reset instructions.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="form-label small fw-bold text-muted text-uppercase">Registered Email</label>
                <div class="input-group">
                    <span class="input-group-text bg-surface border-secondary border-opacity-10 text-muted">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" name="email" class="form-control" placeholder="identify@meditrack.com" required
                        autofocus>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mb-4">
                Send Reset Email <i class="bi bi-send ms-2"></i>
            </button>
        </form>

        <div class="text-center">
            <a href="{% url 'accounts:login' %}" class="text-muted small text-decoration-none">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>
    </div>
</div>

<style>
    .input-group-text {
        border-right: none;
    }

    .form-control {
        border-left: none;
    }
</style>
{% endblock %}
